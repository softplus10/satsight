name: BSD native builds

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      version:
        type: string
        default: snapshot

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [freebsd, openbsd]
    env:
      VERSION: ${{ inputs.version || 'snapshot' }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply release version
        if: inputs.tag != ''
        run: node scripts/release-version.mjs "$TAG"
      - run: npm run build
      - name: Remove host dependencies before VM sync
        run: rm -rf node_modules .svelte-kit
      - name: Native FreeBSD build
        if: matrix.platform == 'freebsd'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.3'
          arch: x86_64
          envs: VERSION
          mem: 6144
          prepare: |
            set -eu
            pkg install -y rust pkgconf bzip2 gtk3 webkit2-gtk_41 libsoup3 libayatana-appindicator
          run: sh scripts/build-bsd.sh
      - name: Native OpenBSD build
        if: matrix.platform == 'openbsd'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        with:
          release: '8.0'
          arch: x86_64
          envs: VERSION
          mem: 6144
          prepare: |
            set -eu
            pkg_add rust pkgconf gtk+3 webkitgtk41
          run: sh scripts/build-bsd.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
